# The docs build, as a check we own. Vercel builds previews and publishes the
# site, but a required check that depends on an outside service stops every
# merge when that service stalls (it did, 2026-10-12). This job is what branch
# protection requires; Vercel stays the publisher.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: docs — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
